
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
    >
    <title>SOPANNUTH</title>
</head>

<body>

    <header class="header">

        <div class="brand">
            <img src="layer/images.png" alt="Sopannuth Logo">
            <h3>SOPANNUTH</h3>
        </div>

        <nav class="menu">
            <a href="#Home">Home</a>
            <a href="#Product">Product</a>
            <a href="#Service">Service</a>
            <a href="#Contact">Contact</a>
        </nav>

        <div class="social">
            <a href="#" title="Facebook">
                <i class="fa-brands fa-facebook"></i>
            </a>

            <a href="#" title="Telegram">
                <i class="fa-brands fa-telegram"></i>
            </a>
        </div>

    </header>

    <section id="Home" class="section home">
        <video autoplay muted loop playsinline>
            <source src="Truck.MP4" type="video/mp4">
        </video>
    </section>

    <section id="Product" class="section product">
        <div class="content">
            <h1>Product</h1>
            <p>Here you can show your products and projects.</p>
        </div>
    </section>

    <section id="Service" class="section service">
        <div class="content">
            <h1>Service</h1>
            <p>Web Development • Software Development • UI Design</p>
        </div>
    </section>

    <section id="Contact" class="section contact">
        <div class="content">
            <h1>Contact</h1>
            <p>Feel free to contact me.</p>

            <div class="contact-icons">
                <a href="#" title="Facebook">
                    <i class="fa-brands fa-facebook"></i>
                </a>

                <a href="#" title="Telegram">
                    <i class="fa-brands fa-telegram"></i>
                </a>

                <a href="mailto:example@gmail.com" title="Email">
                    <i class="fa-solid fa-envelope"></i>
                </a>
            </div>
        </div>
    </section>
    

</body>
</html>
